name: enzymesifter
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.10
  - biopython
  - pandas
  - scipy
  - numpy<2
  - scikit-learn
  - matplotlib
  - tqdm
  - rdkit
  - hmmer>=3.3
  - mmseqs2
  - fasttree
  - muscle
  - git
  - unzip
  - libstdcxx-ng
  - snakemake-minimal
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.4.0
      - --find-links https://data.pyg.org/whl/torch-2.4.0+cu121.html
      - torch_scatter==2.1.2
      - torch_sparse==0.6.18
      - torch_cluster==1.6.3
      - torch_geometric==2.7.0
      - e3nn==0.6.0
      - pdb2pqr==3.6.2
      - onnxruntime-gpu
      - fair-esm==2.0.0
      - transformers
      - accelerate
      - enzymm
      - gdown
